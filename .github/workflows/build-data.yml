name: Build data

# Builds the price tiles from the OFFICIAL geo-DVF file (CI is not behind the
# proxy that blocks .gz downloads locally) and publishes them to R2.
# DVF is refreshed in April and October, so run shortly after each release.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 15 4,10 *'

permissions:
  contents: read

concurrency:
  group: build-data
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: settling-map-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt && pip install -e pipeline
      - run: python -m pytest pipeline/tests -q
      - name: Build national tiles from the official DVF file
        run: python -m settling.build --out data/build/national
      - name: Plausibility gate (blocks publishing bad data)
        run: python pipeline/check_tiles.py data/build/national/communes.pmtiles
      - name: Publish to R2 (versioned tiles first, manifest last)
        run: |
          set -euo pipefail
          out=data/build/national
          version=$(python -c "import json,sys; print(json.load(open('$out/manifest.json'))['version'])")
          python - <<EOF
          import json
          path = "$out/manifest.json"
          manifest = json.load(open(path))
          manifest["tiles"]["file"] = "v$version/" + manifest["tiles"]["file"]
          json.dump(manifest, open(path, "w"), indent=1)
          EOF
          aws s3 cp "$out/communes.pmtiles" "s3://$R2_BUCKET/v$version/communes.pmtiles" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type application/octet-stream
          aws s3 cp "$out/manifest.json" "s3://$R2_BUCKET/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type application/json
