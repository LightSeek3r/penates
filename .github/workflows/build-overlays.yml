name: Build overlays

# Builds overlays.pmtiles (places from the INSEE BPE as dots, seismic zone isolines from Géorisques and flood, clay,
# radon and cavity isolines as lines) and publishes it to R2 with its own manifest, overlays.json, so that Build data
# never overwrites it and a refresh of the places never needs the DVF build. The BPE is refreshed monthly by INSEE and
# the seismic zoning hardly ever changes: twice a year is enough, run it by hand after a new BPE edition.
# The flood, clay, radon and cavity classes are read from the live communes.pmtiles (public, listed in its manifest.json)
# rather than fetched again from Géorisques, so the lines always describe the same data as the commune details: run
# Build data first when those classes changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 5,11 *'

permissions:
  contents: read

concurrency:
  group: build-overlays
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: settling-map-data
  TILES: https://settling-tiles.unit42.fr

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt && pip install -e pipeline
      - run: python -m pytest pipeline/tests -q
      - name: Download the live communes archive (the classes behind the risk lines)
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 10 -o live-manifest.json "$TILES/manifest.json"
          file=$(python -c "import json; print(json.load(open('live-manifest.json'))['tiles']['file'])")
          mkdir -p data/raw/communes-live
          curl -fsS --retry 5 --retry-delay 10 -o data/raw/communes-live/communes.pmtiles "$TILES/$file"
          python - <<'EOF'
          import hashlib, json
          expected = json.load(open("live-manifest.json"))["tiles"]
          data = open("data/raw/communes-live/communes.pmtiles", "rb").read()
          assert len(data) == expected["bytes"], f"downloaded {len(data)} bytes, manifest says {expected['bytes']}"
          assert hashlib.sha256(data).hexdigest() == expected["sha256"], "sha256 of the download differs from the manifest"
          print("communes archive", expected["file"], len(data), "bytes")
          EOF
      - name: Build the national overlays from the official BPE file, the Géorisques API and the live communes archive
        run: python -m settling.overlays --out data/build/overlays --communes-file data/raw/communes-live/communes.pmtiles
      - name: Plausibility gate (blocks publishing bad data)
        run: python pipeline/check_overlays.py data/build/overlays/overlays.pmtiles
      - name: Publish to R2 (versioned tiles first, manifest last)
        run: |
          set -euo pipefail
          out=data/build/overlays
          version=$(python -c "import json,sys; print(json.load(open('$out/overlays.json'))['version'])")
          python - <<EOF
          import json
          path = "$out/overlays.json"
          manifest = json.load(open(path))
          manifest["tiles"]["file"] = "v$version/" + manifest["tiles"]["file"]
          json.dump(manifest, open(path, "w"), indent=1)
          EOF
          aws s3 cp "$out/overlays.pmtiles" "s3://$R2_BUCKET/v$version/overlays.pmtiles" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type application/octet-stream
          aws s3 cp "$out/overlays.json" "s3://$R2_BUCKET/overlays.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public, max-age=300" \
            --content-type application/json
