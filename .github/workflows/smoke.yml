name: Smoke test

# Checks the live tile host from outside any corporate proxy: manifest, CORS,
# HTTP Range support (PMTiles needs 206), PMTiles magic bytes and edge caching.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: App URL to check (leave empty to skip)
        default: https://settling.unit42.fr

permissions:
  contents: read

env:
  TILES: https://settling-tiles.unit42.fr
  ORIGIN: https://settling.unit42.fr

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Manifest
        run: |
          set -euo pipefail
          curl -sS -D headers.txt -o manifest.json "$TILES/manifest.json"
          head -1 headers.txt
          grep -qi '^HTTP/.* 200' headers.txt
          python3 -c "import json; m=json.load(open('manifest.json')); print('version', m['version'], 'tiles', m['tiles']['file'], 'through', m['sources']['transactions']['to'])"
      - name: Range request, CORS and PMTiles magic
        run: |
          set -euo pipefail
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          curl -sS -D range.txt -o range.bin -H "Origin: $ORIGIN" -H "Range: bytes=0-16383" "$TILES/$file"
          cat range.txt
          grep -qi '^HTTP/.* 206' range.txt
          grep -qi "^access-control-allow-origin: \($ORIGIN\|\*\)" range.txt
          grep -qi '^content-range: bytes 0-16383/' range.txt
          head -c 7 range.bin | grep -q PMTiles
          echo "range + CORS + magic OK"
      - name: Edge cache (second request should HIT)
        run: |
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          for i in 1 2; do
            curl -sS -D - -o /dev/null -H "Range: bytes=0-16383" "$TILES/$file" | grep -i -E '^(cf-cache-status|age|cache-control):' || true
            echo ---
          done
      - name: CORS preflight
        run: |
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$TILES/$file" | grep -i -E '^(HTTP|access-control)'
      - name: App responds
        if: ${{ inputs.app_url != '' }}
        run: |
          curl -sS -D - -o app.html "${{ inputs.app_url }}" | head -1
          grep -q 'settling-map' app.html
