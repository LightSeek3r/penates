name: Smoke test

# Checks the live tile host from outside any corporate proxy: manifest, CORS,
# HTTP Range support (PMTiles needs 206), PMTiles magic bytes and edge caching.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: App URL to check (leave empty to skip)
        default: ''

permissions:
  contents: read

env:
  TILES: https://settling-tiles.unit42.fr
  ORIGIN: https://settling.unit42.fr

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest
        run: |
          set -euo pipefail
          curl -sS -D headers.txt -o manifest.json "$TILES/manifest.json"
          head -1 headers.txt
          grep -qi '^HTTP/.* 200' headers.txt
          python3 -c "import json; m=json.load(open('manifest.json')); print('version', m['version'], 'tiles', m['tiles']['file'], 'through', m['sources']['transactions']['to'])"
      - name: Range request, CORS and PMTiles magic
        run: |
          set -euo pipefail
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          curl -sS -D range.txt -o range.bin -H "Origin: $ORIGIN" -H "Range: bytes=0-16383" "$TILES/$file"
          cat range.txt
          grep -qi '^HTTP/.* 206' range.txt
          grep -qi "^access-control-allow-origin: \($ORIGIN\|\*\)" range.txt
          grep -qi '^content-range: bytes 0-16383/' range.txt
          head -c 7 range.bin | grep -q PMTiles
          echo "range + CORS + magic OK"
      - name: Edge cache behaviour (range vs full GET)
        run: |
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          show() { grep -i -E '^(cf-cache-status|age):' | paste -sd' ' -; }
          echo "range #1:"; curl -sS -D - -o /dev/null -H "Range: bytes=0-16383" "$TILES/$file" | show
          echo "full   #1:"; curl -sS -D - -o /dev/null "$TILES/$file" | show
          echo "full   #2:"; curl -sS -D - -o /dev/null "$TILES/$file" | show
          echo "range #2 (after full GETs):"; curl -sS -D - -o /dev/null -H "Range: bytes=0-16383" "$TILES/$file" | show
      - name: Live tiles pass the plausibility gate
        run: |
          set -euo pipefail
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          curl -sS -o live.pmtiles "$TILES/$file"
          pip install -q -r pipeline/requirements.txt
          python pipeline/check_tiles.py live.pmtiles
      - name: Overlays manifest, Range, CORS and magic
        run: |
          set -euo pipefail
          curl -sS -D overlays-headers.txt -o overlays.json "$TILES/overlays.json"
          head -1 overlays-headers.txt
          grep -qi '^HTTP/.* 200' overlays-headers.txt
          file=$(python3 -c "import json; print(json.load(open('overlays.json'))['tiles']['file'])")
          python3 -c "import json; m=json.load(open('overlays.json')); print('overlays version', m['version'], 'layers', sorted(m['layers']))"
          curl -sS -D overlays-range.txt -o overlays-range.bin -H "Origin: $ORIGIN" -H "Range: bytes=0-16383" "$TILES/$file"
          grep -qi '^HTTP/.* 206' overlays-range.txt
          grep -qi "^access-control-allow-origin: \($ORIGIN\|\*\)" overlays-range.txt
          head -c 7 overlays-range.bin | grep -q PMTiles
          echo "overlays range + CORS + magic OK"
      - name: Live overlays pass their plausibility gate
        run: |
          set -euo pipefail
          file=$(python3 -c "import json; print(json.load(open('overlays.json'))['tiles']['file'])")
          curl -sS -o live-overlays.pmtiles "$TILES/$file"
          pip install -q -r pipeline/requirements.txt
          python pipeline/check_overlays.py live-overlays.pmtiles
      - name: CORS preflight
        run: |
          file=$(python3 -c "import json; print(json.load(open('manifest.json'))['tiles']['file'])")
          curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$TILES/$file" | grep -i -E '^(HTTP|access-control)'
      - name: Admin and its API are behind Cloudflare Access
        run: |
          set -u
          for path in /admin/ /api/admin/stats; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://settling.unit42.fr$path")
            echo "$path -> $out"
            case "$out" in
              302*cloudflareaccess.com*|403*) ;;
              *) echo "::error::$path is not protected by Access"; exit 1 ;;
            esac
          done
      - name: Event endpoint accepts a counter and rejects a foreign origin
        run: |
          set -u
          ok=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://settling.unit42.fr/api/event -H 'content-type: application/json' -d '{"events":[]}')
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://settling.unit42.fr/api/event -H 'origin: https://evil.example' -H 'content-type: application/json' -d '{"events":[]}')
          echo "empty batch -> $ok, foreign origin -> $bad"
          [ "$ok" = 204 ] && [ "$bad" = 403 ]
      - name: App responds
        if: ${{ inputs.app_url != '' }}
        run: |
          curl -sS -D - -o app.html "${{ inputs.app_url }}" | head -1
          grep -q 'settling-map' app.html
