name: Production e2e

# Runs the Playwright suite against the deployed site from GitHub's network.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to test
        default: https://settling.unit42.fr

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_BASE_URL: ${{ inputs.url }}
          # Tests of indicators and overlays read the live tile host to know what the data carries, and skip without it.
          E2E_DATA_BASE: https://settling-tiles.unit42.fr
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results
