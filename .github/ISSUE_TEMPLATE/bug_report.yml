name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the view
      description: The address carries the position, theme, filters and selected commune, so it reproduces the view.
      placeholder: https://penates.unit42.fr/#z=9&lat=48.11&lng=-1.68
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of the "Sources and limits" dialog.
      placeholder: v0.8.0
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Android 15, 390x844
